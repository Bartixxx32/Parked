name: Robo test

# Firebase Test Lab crawls the debug APK on virtual devices and reports crashes,
# ANRs, screenshots, video and logcat. This is a smoke test, not a replacement
# for the JVM tests and not a screenshot generator.
#
# Required repository secrets:
#   GCP_PROJECT_ID      Firebase/Google Cloud project id
#   GCP_SA_KEY          service-account JSON with the Firebase Test Lab Admin role
# Optional:
#   GCP_RESULTS_BUCKET  gs:// bucket for results (the service account needs
#                        Storage Object Admin on it); without it results stay in
#                        the Firebase console only.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: false
        default: main
      devices:
        description: One Test Lab device per line
        required: false
        default: |
          model=MediumPhone.arm,version=35,locale=pl_PL,orientation=portrait
          model=MediumPhone.arm,version=35,locale=en_US,orientation=portrait
      timeout:
        description: Robo crawl timeout per device (for example 5m)
        required: false
        default: 5m
      robo_script:
        description: Optional path to a recorded Robo script in the repository
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: robo-test
  cancel-in-progress: false

jobs:
  robo:
    name: Crawl the debug APK on Firebase Test Lab
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_RESULTS_BUCKET: ${{ secrets.GCP_RESULTS_BUCKET }}
      DEVICES: ${{ inputs.devices }}
      ROBO_TIMEOUT: ${{ inputs.timeout }}
      ROBO_SCRIPT: ${{ inputs.robo_script }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GCP_PROJECT_ID:-}" ]; then
            echo "::error::Add the GCP_PROJECT_ID repository secret."
            exit 1
          fi
          if [ -z "${GCP_SA_KEY:-}" ]; then
            echo "::error::Add the GCP_SA_KEY repository secret (service-account JSON)."
            exit 1
          fi
          if [ -n "${ROBO_SCRIPT:-}" ] && [ ! -f "$ROBO_SCRIPT" ]; then
            echo "::error::Robo script not found: $ROBO_SCRIPT"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::Debug APK was not produced"; exit 1; }
          echo "APK: $(du -h "$APK" | cut -f1)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Robo test
        run: |
          set -euo pipefail
          args=(
            --type robo
            --app app/build/outputs/apk/debug/app-debug.apk
            --timeout "$ROBO_TIMEOUT"
            --project "$GCP_PROJECT_ID"
            --quiet
          )
          if [ -n "${ROBO_SCRIPT:-}" ]; then
            args+=(--robo-script-file "$ROBO_SCRIPT")
          fi
          if [ -n "${GCP_RESULTS_BUCKET:-}" ]; then
            bucket="${GCP_RESULTS_BUCKET%/}"
            args+=(--results-bucket "$bucket" --results-dir "robo/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          fi

          devices=0
          while IFS= read -r device; do
            device="${device%$'\r'}"
            device="$(echo "$device" | xargs)"
            [ -n "$device" ] || continue
            args+=(--device "$device")
            devices=$((devices + 1))
          done <<< "$DEVICES"
          if [ "$devices" -eq 0 ]; then
            echo "::error::No Test Lab devices configured."
            exit 1
          fi

          gcloud firebase test android run "${args[@]}"

      - name: Copy Robo test results
        if: always() && env.GCP_RESULTS_BUCKET != ''
        run: |
          set -euo pipefail
          bucket="${GCP_RESULTS_BUCKET%/}"
          mkdir -p robo-results
          gcloud storage cp --recursive \
            "${bucket}/robo/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/**" \
            robo-results || true
          find robo-results -type f | head -n 20

      - name: Upload Robo test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robo-test-results
          path: robo-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Firebase Robo test"
            echo ""
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Timeout: \`${{ inputs.timeout }}\`"
            echo "- Devices:"
            echo '```'
            printf '%s\n' "$DEVICES"
            echo '```'
            echo "- Result: **${{ job.status }}**"
            if [ -n "${GCP_RESULTS_BUCKET:-}" ]; then
              echo "- Results bucket: \`${GCP_RESULTS_BUCKET}/robo/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
