name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PARKED_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret PARKED_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/parked-release.p12"
          test -s "$RUNNER_TEMP/parked-release.p12"

      - name: Test and build signed release APK
        env:
          PARKED_KEYSTORE_FILE: ${{ runner.temp }}/parked-release.p12
          PARKED_KEYSTORE_TYPE: PKCS12
          PARKED_KEYSTORE_PASSWORD: ${{ secrets.PARKED_KEYSTORE_PASSWORD }}
          PARKED_KEY_ALIAS: ${{ secrets.PARKED_KEY_ALIAS }}
          PARKED_KEY_PASSWORD: ${{ secrets.PARKED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PARKED_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${PARKED_KEY_ALIAS:-}" ] || \
             [ -z "${PARKED_KEY_PASSWORD:-}" ]; then
            echo "::error::Signing secrets are incomplete (PARKED_KEYSTORE_PASSWORD, PARKED_KEY_ALIAS, PARKED_KEY_PASSWORD)"
            exit 1
          fi
          # One Gradle invocation: release classes compiled for the tests are reused
          # by assembleRelease instead of being configured and checked twice.
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease --stacktrace

      - name: Verify APK signature and prepare release files
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Release APK was not produced"; exit 1; }

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -n 25

          VERSION="$("$BUILD_TOOLS/aapt2" dump badging "$APK" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          test -n "$VERSION" || { echo "::error::Cannot read versionName"; exit 1; }

          OUT="Parked-${VERSION}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "RELEASE_FILE=$OUT" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

          {
            echo "## Parked ${VERSION}"
            echo ""
            echo "- Signed with the stable release key (apksigner verify passed)"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$OUT.sha256")\`"
            echo "- File: \`$OUT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parked-release-apk
          path: |
            Parked-*.apk
            Parked-*.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Parked-*.apk Parked-*.apk.sha256 --clobber
          else
            gh release create "$TAG" Parked-*.apk Parked-*.apk.sha256 \
              --title "Parked $TAG" \
              --generate-notes
          fi
