name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.4.1)'
        required: true
        default: 'v1.4.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # apksigner from build-tools 34 produces a v2-only signature that
  # apksigcopier (used by F-Droid) can verify reproducibly.
  SIGNING_BUILD_TOOLS_VERSION: '34.0.0'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            build-tools;${{ env.SIGNING_BUILD_TOOLS_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PARKED_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret PARKED_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/parked-release.p12"
          test -s "$RUNNER_TEMP/parked-release.p12"

      - name: Build unsigned release APK
        # No PARKED_* signing variables here on purpose: the release build must be
        # unsigned so F-Droid can reproduce it and compare it with apksigcopier.
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease --stacktrace

      - name: Sign APK with build-tools 34
        env:
          PARKED_KEYSTORE_PASSWORD: ${{ secrets.PARKED_KEYSTORE_PASSWORD }}
          PARKED_KEY_ALIAS: ${{ secrets.PARKED_KEY_ALIAS }}
          PARKED_KEY_PASSWORD: ${{ secrets.PARKED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PARKED_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${PARKED_KEY_ALIAS:-}" ] || \
             [ -z "${PARKED_KEY_PASSWORD:-}" ]; then
            echo "::error::Signing secrets are incomplete (PARKED_KEYSTORE_PASSWORD, PARKED_KEY_ALIAS, PARKED_KEY_PASSWORD)"
            exit 1
          fi

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED" || { echo "::error::Unsigned release APK was not produced"; exit 1; }

          BT="$ANDROID_HOME/build-tools/${SIGNING_BUILD_TOOLS_VERSION}"
          test -x "$BT/apksigner" || { echo "::error::apksigner $SIGNING_BUILD_TOOLS_VERSION not found"; exit 1; }

          VERSION="$("$BT/aapt2" dump badging "$UNSIGNED" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          test -n "$VERSION" || { echo "::error::Cannot read versionName"; exit 1; }

          OUT="Parked-${VERSION}.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/parked-release.p12" \
            --ks-type PKCS12 \
            --ks-pass "env:PARKED_KEYSTORE_PASSWORD" \
            --ks-key-alias "$PARKED_KEY_ALIAS" \
            --key-pass "env:PARKED_KEY_PASSWORD" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$OUT" \
            "$UNSIGNED"

          echo "RELEASE_FILE=$OUT" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify signature and reproducibility
        env:
          PARKED_KEYSTORE_PASSWORD: ${{ secrets.PARKED_KEYSTORE_PASSWORD }}
          PARKED_KEY_ALIAS: ${{ secrets.PARKED_KEY_ALIAS }}
          PARKED_KEY_PASSWORD: ${{ secrets.PARKED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/${SIGNING_BUILD_TOOLS_VERSION}"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="$RELEASE_FILE"

          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee /tmp/apksigner-verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner-verify.txt \
            || { echo "::error::APK is not v2-signed"; exit 1; }

          "$BT/aapt2" dump badging "$OUT" | head -n 25

          # Same verification F-Droid performs: the signed APK must be identical to
          # the unsigned build apart from the signature block.
          python3 -m venv "$RUNNER_TEMP/apksigcopier-venv"
          "$RUNNER_TEMP/apksigcopier-venv/bin/pip" install --quiet apksigcopier
          PATH="$BT:$PATH" "$RUNNER_TEMP/apksigcopier-venv/bin/apksigcopier" \
            compare --unsigned "$OUT" "$UNSIGNED"

          sha256sum "$OUT" | tee "$OUT.sha256"
          {
            echo "## Parked ${RELEASE_VERSION}"
            echo ""
            echo "- Signed with the stable release key (apksigner verify passed)"
            echo "- v2 signature only, build-tools ${SIGNING_BUILD_TOOLS_VERSION}"
            echo "- Reproducible: apksigcopier comparison passed"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$OUT.sha256")\`"
            echo "- File: \`$OUT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parked-release-apk
          path: |
            Parked-*.apk
            Parked-*.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Parked-*.apk Parked-*.apk.sha256 --clobber
          else
            gh release create "$TAG" Parked-*.apk Parked-*.apk.sha256 \
              --title "Parked $TAG" \
              --generate-notes
          fi
