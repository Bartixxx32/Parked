name: Release smoke test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (default: main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  smoke:
    name: Install minified release APK and launch it
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            emulator
            system-images;android-35;default;x86_64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Sign with a throwaway key
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore /tmp/smoke.p12 -storetype PKCS12 \
            -storepass smoke123 -keypass smoke123 -alias smoke -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=Smoke"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" sign \
            --ks /tmp/smoke.p12 --ks-type PKCS12 \
            --ks-pass pass:smoke123 --ks-key-alias smoke --key-pass pass:smoke123 \
            --out Parked-smoke.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify Parked-smoke.apk
          cp Parked-smoke.apk "$RUNNER_TEMP/Parked-smoke.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and exercise the release APK
        env:
          PARKED_PKG: com.bartixxx.parked
          SCREENSHOT_OUT: screenshots-release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/scripts/smoke.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            logcat.txt
            screenshots-release/
          if-no-files-found: ignore
          retention-days: 14
