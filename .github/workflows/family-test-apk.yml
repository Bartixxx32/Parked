name: Family test APK

# Builds a minified release APK signed with a throwaway key and uploads it as a
# workflow artifact. This is only for testing a branch; it never publishes a
# GitHub Release and the key is not the upstream release key.

on:
  push:
    branches: [ family-mode ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-apk:
    name: Test, build and sign the R8 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and build the R8 release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease --stacktrace

      - name: Sign with a throwaway key
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED" || { echo "::error::Release APK was not produced"; exit 1; }

          keytool -genkeypair -keystore /tmp/family-test.p12 -storetype PKCS12 \
            -storepass familytest -keypass familytest -alias familytest \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Parked family test"

          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" sign \
            --ks /tmp/family-test.p12 --ks-type PKCS12 \
            --ks-pass pass:familytest --ks-key-alias familytest \
            --key-pass pass:familytest \
            --out Parked-family-test.apk "$UNSIGNED"
          "$BT/apksigner" verify --verbose --print-certs Parked-family-test.apk

          "$BT/aapt2" dump badging Parked-family-test.apk | head -n 20
          echo "APK size: $(du -h Parked-family-test.apk | cut -f1)"
          sha256sum Parked-family-test.apk | tee Parked-family-test.apk.sha256

          {
            echo "## Parked family-mode test APK"
            echo ""
            echo "Signed with a throwaway key for testing only. It cannot update an"
            echo "official or F-Droid installation signed with another key."
            echo ""
            echo "- Version: $(unzip -p Parked-family-test.apk META-INF/com/android/build/gradle/app-metadata.properties 2>/dev/null | grep -i versionName || true)"
            echo "- Size: $(du -h Parked-family-test.apk | cut -f1)"
            echo "- SHA-256: \`$(sha256sum Parked-family-test.apk | cut -d' ' -f1)\`"
            echo ""
            echo "Download the APK from this run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Parked-family-test-apk
          path: |
            Parked-family-test.apk
            Parked-family-test.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: family-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
