name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Install everything in one sdkmanager pass. cmdline-tools 19+ no longer
          # ships the obsolete "tools" package, so the list is explicit.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Gradle and toolchain info
        run: ./gradlew --version

      - name: Run unit tests and build debug and release APKs
        # One Gradle invocation: the test task compiles the app, and the assemble
        # tasks reuse those outputs. assembleRelease also exercises R8, so a broken
        # keep rule fails here instead of during the release.
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify APKs
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK" || { echo "::error::Debug APK was not produced"; exit 1; }
          test -s "$RELEASE_APK" || { echo "::error::Release APK was not produced"; exit 1; }

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"
          echo "Debug APK size: $(du -h "$APK" | cut -f1)"
          echo "Release APK size: $(du -h "$RELEASE_APK" | cut -f1)"

          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -n 25
          "$BUILD_TOOLS/aapt2" dump badging "$RELEASE_APK" | head -n 25
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          cp "$APK" Parked-debug.apk
          cp "$RELEASE_APK" Parked-release-unsigned.apk
          sha256sum Parked-debug.apk Parked-release-unsigned.apk | tee apk.sha256

          {
            echo "## Parked APKs"
            echo ""
            echo "- Package: $(unzip -p "$APK" META-INF/com/android/build/gradle/app-metadata.properties 2>/dev/null | grep -i versionName || true)"
            echo "- Debug size: $(du -h Parked-debug.apk | cut -f1)"
            echo "- Release (R8, unsigned) size: $(du -h Parked-release-unsigned.apk | cut -f1)"
            echo "- SHA-256 (debug): \`$(sha256sum Parked-debug.apk | cut -d' ' -f1)\`"
            echo "- SHA-256 (release): \`$(sha256sum Parked-release-unsigned.apk | cut -d' ' -f1)\`"
            echo ""
            echo "Download the APKs from this workflow run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Parked-apks
          path: |
            Parked-debug.apk
            Parked-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
